[project]
name = "cost-average-out"
version = "0.0.0"
description = "Self-hosted recurring crypto sell automation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.14.1",
  "ccxt>=4.4",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.scripts]
cost-average-out = "cost_average_out.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
